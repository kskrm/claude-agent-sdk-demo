[project]
name = "ai-weekly"
version = "0.1.0"
description = "Claude Agent SDK で AI 業界の週次トレンドを収集し、HTML レポートを生成して Discord に通知する"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
