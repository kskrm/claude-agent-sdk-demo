name: AI Weekly Report

on:
  schedule:
    # 毎週土曜 07:00 JST = 金曜 22:00 UTC（GitHub Actions の cron は UTC 固定）
    - cron: "0 22 * * 5"
  workflow_dispatch:        # 画面からの手動実行も可能にする
    inputs:
      date:
        description: "基準日 (YYYY-MM-DD)。空なら実行日"
        required: false
        default: ""

permissions:
  contents: write           # 生成した docs/ と data/ をコミットして戻すために必要

concurrency:
  group: ai-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          uv run python -m ai_weekly.main ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: AI Weekly report $(date -u +%Y-%m-%d)"
            git push
          fi
